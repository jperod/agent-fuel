name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required to fetch the OIDC token from GitHub
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Verify npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [maj, min, pat] = require("child_process").execFileSync("npm", ["-v"], { encoding: "utf8" }).trim().split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            process.exit(ok ? 0 : 1);
          ' || npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test

      - name: Verify package tarball
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance
